# Analisis en SonarCloud desde el CI (.github/workflows/ci.yml).
# Claves por defecto al importar el repo de GitHub en SonarCloud; cambiarlas si el proyecto se creo con otras.
sonar.organization=tadeo77789
sonar.projectKey=tadeo77789_frontendTS
sonar.projectName=Traduce Señas · Frontend

sonar.sources=src,Dockerfile
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**
sonar.exclusions=src/**/__tests__/**,src/assets/**

# Cobertura que genera `npm test -- --coverage` (jest.config.js define collectCoverageFrom).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Los archivos de idioma repiten las mismas claves a proposito; no cuentan como duplicacion.
sonar.cpd.exclusions=src/app/config/i18n/locales/**

# S2068 (contrasena en el codigo) salta con las etiquetas de la interfaz:
# `password: 'Contraseña'` es el texto del campo, no una credencial.
sonar.issue.ignore.multicriteria=i18nPasswordLabels
sonar.issue.ignore.multicriteria.i18nPasswordLabels.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.i18nPasswordLabels.resourceKey=src/app/config/i18n/locales/**
