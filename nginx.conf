server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Solo sirve la web estatica. En produccion Caddy (repo Backend, docker-compose.prod.yml)
    # termina HTTPS y envia /api/* directo al api-gateway; aqui no llega ninguna llamada a la API.

    # Cabeceras de seguridad. SAMEORIGIN (no DENY): el visor 3D del alfabeto
    # usa un iframe srcDoc propio. La camara se permite para MediaPipe.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # CSP en modo "Report-Only": el navegador avisa en la consola de lo que bloquearia, sin bloquearlo.
    # Pasar a "Content-Security-Policy" cuando la consola no muestre avisos con sesion iniciada
    # (traduccion, abecedario 3D, login con Google y Facebook).
    #   'unsafe-inline': el visor 3D es un iframe srcDoc con un <script> en linea (hereda esta CSP).
    #   'unsafe-eval': MediaPipe se importa desde el CDN con new Function('return import(u)').
    #   'wasm-unsafe-eval': MediaPipe corre en WebAssembly.
    #   cdn.jsdelivr.net: MediaPipe y three.js; storage.googleapis.com: modelos .task de MediaPipe.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'" always;

    # SPA: cualquier ruta desconocida vuelve al index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
