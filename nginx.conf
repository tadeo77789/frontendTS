server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida vuelve al index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lexicon (alfabeto y medios): servicio aparte. Va antes de /api/ para que gane.
    # $http_host conserva el puerto publico, asi las URL de medios salen bien.
    location /api/lexicon/ {
        proxy_pass http://lexicon:3003/api/lexicon/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy al backend dentro de la red de docker compose
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
